[package]
name = "bhandara"
version = "0.1.0"
description = "Cross-platform storage monitor"
license = "MIT"
edition = "2024"

[lib]
name = "bhandara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
bhandara-core = { version = "0.1.0", path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-storage-access = { version = "0.1.0", path = "../../plugins/storage-access" }
