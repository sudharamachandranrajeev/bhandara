[package]
name = "bhandara-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
blake3 = "1.8.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5.2.9"

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = "0.39.6"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Performance", "Win32_Foundation"] }
