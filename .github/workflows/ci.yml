name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Omarchy plugin tests
        run: node --test omarchy/tests/*.test.mjs
      - name: UI check and build
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # tauri.windows.conf.json bundles these, and tauri-build checks they
      # exist, so they come before clippy.
      - name: Bundle health helper and smartctl
        shell: pwsh
        run: |
          cargo build --release -p bhandara-core --bin bhandara-health
          New-Item -ItemType Directory -Force app/src-tauri/binaries | Out-Null
          Copy-Item target/release/bhandara-health.exe app/src-tauri/binaries/bhandara-health-x86_64-pc-windows-msvc.exe
          $url = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.win32-setup.exe"
          Invoke-WebRequest $url -OutFile smartmontools-setup.exe
          $hash = (Get-FileHash smartmontools-setup.exe -Algorithm SHA256).Hash
          if ($hash -ne "896337fcc253220614cf8cdbd5cf2321c5aa326a37a04160a672a281e6104c70") { throw "smartmontools installer hash mismatch: $hash" }
          7z x smartmontools-setup.exe -osmartmontools -y | Out-Null
          Get-ChildItem smartmontools -Recurse -Include smartctl.exe, COPYING* | ForEach-Object FullName
          # Prefer the 64-bit build when the installer carries both.
          $smartctl = Get-ChildItem smartmontools -Recurse -Filter smartctl.exe | Sort-Object { $_.FullName -notmatch '64' } | Select-Object -First 1
          $license = Get-ChildItem smartmontools -Recurse -Filter 'COPYING*' | Select-Object -First 1
          if (-not $smartctl -or -not $license) { throw "smartctl.exe or its license not found in the installer" }
          Copy-Item $smartctl.FullName app/src-tauri/binaries/smartctl.exe
          Copy-Item $license.FullName app/src-tauri/binaries/smartmontools-COPYING.txt
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # NSIS only: its install hooks add and remove the health task.
      - name: Build installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bhandara-windows
          path: target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build debug APK
        working-directory: app
        run: |
          npm ci
          npm run tauri android init -- --ci
          npm run tauri android build -- --ci --debug --apk --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: bhandara-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
